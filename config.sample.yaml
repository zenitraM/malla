# Sample configuration for Malla (rename to 'config.yaml' and adjust as needed)
# All fields are optional – defaults are shown below. Each setting can also be
# overridden via environment variables using the `MALLA_` prefix. For example,
# to override `host`, set `MALLA_HOST=127.0.0.1`.

# Display name shown in the navigation bar and browser title
name: "Malla"

# Operator page customization (optional).
# custom_css is injected as an inline <style> at the end of every page's <head>,
# so it overrides the built-in theme. The theme is driven by Bootstrap CSS
# variables, so overriding --bs-primary recolors the whole site (incl. navbar).
# Env var: MALLA_CUSTOM_CSS
# custom_css: |
#   :root { --bs-primary: #14532d; --bs-primary-rgb: 20, 83, 45; }
#   .navbar { background-color: #14532d !important; }
#
# custom_html_head is raw HTML injected into <head> (favicon, meta tags,
# <link>, <script>, ...). Scripts should wait for the DOM (defer / DOMContentLoaded).
# Env var: MALLA_CUSTOM_HTML_HEAD
# custom_html_head: |
#   <link rel="icon" href="https://example.com/favicon.ico">

# Markdown content rendered on the dashboard homepage
home_markdown: |
  # Welcome to Malla
  This content is written in **Markdown** and will appear at the top of the
  dashboard. You can use standard Markdown formatting.

# Flask / server options ----------------------------------------------------

# Secret key used by Flask for session signing (change for production!)
secret_key: "dev-secret-key-change-in-production"

# SQLite database file path (relative or absolute)
database_file: "meshtastic_history.db"

# Host interface and port for the web server
host: "0.0.0.0"
port: 5008

# Enable Flask debug mode (do **not** use in production)
debug: false

# Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
# log_level: "INFO"

# ---------------------------------------------------------------------------
# MQTT capture settings (used by malla-capture)
# ---------------------------------------------------------------------------

# mqtt_broker_address: "127.0.0.1"
# mqtt_port: 1883
# mqtt_username: ""  # optional
# mqtt_password: ""  # optional
# mqtt_topic_prefix: "msh"
# mqtt_topic_suffix: "/+/+/+/#"
# mqtt_client_id: ""  # optional, leave empty for a randomly generated client ID

# Default channel key(s) used for decrypting secondary channels (base64)
# Supports multiple comma-separated keys - each key will be tried in order
# until one successfully decrypts the packet
# Examples:
#   Single key:    "1PG7OiApB1nwvP+rz05pAQ=="
#   Multiple keys: "1PG7OiApB1nwvP+rz05pAQ==,AQ4GCAwQFBgcICQoLDA0ODw=,another+base64+key=="
# default_channel_key: "1PG7OiApB1nwvP+rz05pAQ=="

# Reverse proxy settings
# Comma-separated IPs of trusted reverse proxies.
# When set, Malla trusts the configured client IP header from those exact proxy
# peers. Recommended for Anubis: X-Real-IP
# trusted_proxy_client_ip_header: "X-Real-IP"
# ProxyFix is still used for X-Forwarded-Proto when enabled. When running via
# Gunicorn, these same IPs are passed to forwarded_allow_ips so only those
# proxy peers can forward headers.
# Corresponding env var: MALLA_TRUSTED_PROXY_IPS
# trusted_proxy_ips: "10.89.0.90"

# Number of hours after which to delete old data (0 = never delete)
# data_retention_hours: 0

# OpenTelemetry settings
# Endpoint for sending traces (e.g. "http://localhost:4317")
# otlp_endpoint: ""
